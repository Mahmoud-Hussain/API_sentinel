openapi: 3.0.3
info:
  title: API Sentinel - Demo Spec v2 (Aligned Updated Contract)
  version: 2.0.0
  description: >-
    Version 2.0.0 (Updated Contract) — Fully documents debug_internal_id
    and adjusts login schema to match live backend implementation.
    Result when tested against example_app: All endpoints PASS cleanly (0 drifts).
servers:
  - url: http://127.0.0.1:8000
    description: Demo API Server

paths:
  /api/v1/users:
    get:
      summary: List all users
      description: Returns list of active users with role and department info.
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserV2'
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV2'

  /api/v1/users/{id}:
    get:
      summary: Get user profile with debug telemetry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User profile including documented debug_internal_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV2'

  /api/v1/auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login response with bearer token
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string

components:
  schemas:
    UserV2:
      type: object
      required:
        - id
        - name
        - email
        - role
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, user, guest]
        debug_internal_id:
          type: string
          description: Internal diagnostic identifier for debugging

    CreateUserRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
