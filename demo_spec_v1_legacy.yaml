openapi: 3.0.3
info:
  title: API Sentinel - Demo Spec v1 (Strict Legacy Contract)
  version: 1.0.0
  description: >-
    Version 1.0.0 (Strict Contract) — Does NOT document internal debug fields
    and strictly requires token_type on authentication.
    Result when tested against example_app: Produces WARNING and ERROR drifts.
servers:
  - url: http://127.0.0.1:8000
    description: Demo API Server

paths:
  /api/v1/users:
    get:
      summary: List all users
      description: Returns list of basic active users.
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserV1'
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV1'

  /api/v1/users/{id}:
    get:
      summary: Get user profile by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Standard user profile (debug_internal_id is NOT permitted here)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV1'

  /api/v1/auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login response strictly requiring token_type
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - token_type
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string

components:
  schemas:
    UserV1:
      type: object
      required:
        - id
        - name
        - email
        - role
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, user]

    CreateUserRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
